
name: Compilar Laravel React

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Vite
        run: npm run build

      - name: Guardar archivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build/
          if-no-files-found: error
